id: return-impatience-condition
name: Return Impatience Condition (RIC)
short: RIC
defining_equation:
  anchor: ass-RIC
  latex: \RPFac < 1
  english: 'The absolute patience factor falls short of the gross interest factor.'
gloss: |
  RIC says the return patience factor $\RPFac := \APFac/\Rfree$ is below 1, i.e. the absolute patience factor $\APFac := (\Rfree\DiscFac)^{1/\CRRA}$ is smaller than the gross interest factor $\Rfree$.

  Return impatience captures the tension between the income effect of capital income and the substitution effect: the marginal propensity to consume out of total (human plus nonhuman) wealth that would just maintain next-period wealth equals $\MPC = 1 - \APFac/\Rfree$, so RIC is exactly the condition that this MPC is positive. Without RIC, the consumer effectively wants to hold more wealth tomorrow than today, which together with infinite human wealth produces a degenerate limiting solution where consumption goes to zero.

  In the perfect-foresight unconstrained problem, RIC together with finite human wealth (FHWC) is necessary and sufficient for a non-degenerate limiting solution (`pf-unconstrained-requires-fhwc`). RIC has a weaker form, WRIC, that adjusts for the probability of zero-income events; WRIC is the condition actually required by the stochastic-problem existence theorems.
relations:
  - kind: requires
    target: return-patience-factor
    note: 'RIC is exactly the inequality $\RPFac < 1$.'
  - kind: requires
    target: absolute-patience-factor
    note: 'Transitively: $\RPFac = \APFac/\Rfree$ is built from $\APFac$.'
  - kind: contrasts-with
    target: growth-impatience-condition
    note: 'RIC is about return (ratio to interest factor); GIC is about growth (ratio to permanent income growth factor).'
  - kind: implied-by
    target: finite-value-of-autarky
    note: 'Under FHWC, FVAC implies RIC (claim-PFConspC, concept pf-consumption-function-properties).'
  - kind: implied-by
    target: pf-consumption-function-properties
    note: 'Reciprocal edge: under FHWC the perfect-foresight patience chain (claim-PFConspC) gives FVAC⇒RIC, so GICRaw+FHWC also delivers RIC ($\RPFac<1$).'
  - kind: assumed-by
    target: pf-unconstrained-requires-fhwc
    note: 'Non-degenerate limiting solution exists iff FHWC and RIC both hold (prop-pfUCFHWC).'
  - kind: generalises
    target: weak-return-impatience-condition
    note: 'WRIC is a weaker form that adjusts the patience factor for zero-income probability.'
  - kind: contrasts-with
    target: contraction-mapping-consumption-bounds
    note: 'Mirror of contraction-mapping-consumption-bounds contrasts-with RIC: under RIC the minimal MPC is positive and the bounded Bellman operator is a single stationary contraction; under only WRIC it is time-varying.'
  - kind: contrasts-with
    target: nondegenerate-solution-existence
    note: 'Mirror of nondegenerate-solution-existence contrasts-with RIC: under uncertainty only WRIC is needed for a non-degenerate solution, whereas RIC was necessary in the perfect-foresight benchmark.'
  - kind: contrasts-with
    target: consumption-function-c2-concave
    note: 'Mirror: the C2/concavity shape result is unconditional, but the minimal MPC it bounds is strictly positive only under RIC (per limiting-mpcs-lemma).'
  - kind: contrasts-with
    target: limiting-consumption-strictly-positive
    note: 'Mirror edge: under RIC the inherited lower ray $\cFunc(\mNrm)\geq\MPCmin\mNrm$ with $\MPCmin>0$ already gives positivity; under only WRIC ($\MPCmin=0$) remark-cStatStrctPos needs a separate Bellman-equation argument for strict positivity.'
