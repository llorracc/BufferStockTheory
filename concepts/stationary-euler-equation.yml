id: stationary-euler-equation
name: Stationary Euler Equation (Converged Consumption Function)
defining_equation:
  anchor: eq-EuelrStatC
  latex: \cFunc(\mNrm)^{-\CRRA} = \Rfree \DiscFac \Ex_{t}[ \Rnd{\PermGroFac}_{t+1}^{-\CRRA} \cFunc(\mNrm^{\nxt})^{-\CRRA}]
  english: 'Under weak return impatience, the limiting (converged) consumption function satisfies the normalized consumption Euler equation exactly: current marginal utility equals the return- and discount-weighted expectation of growth-adjusted marginal utility at the next-period resources $\mNrm^{\nxt}=\RNrmByGRnd(\mNrm-\cFunc(\mNrm))+\tranShkAll$ generated by the rule itself.'
gloss: |
  This property (stated as a `prf:property` labelled [](#eq-EuelrStatC) and invoked by the paper as a Claim) verifies that the limiting non-degenerate consumption function $\cFunc$ — the policy attached to the fixed point of the Bellman operator delivered by the existence theorem — satisfies the intertemporal first-order condition exactly: $\cFunc(\mNrm)^{-\CRRA}=\Rfree\DiscFac\Ex_{t}[\Rnd{\PermGroFac}_{t+1}^{-\CRRA}\cFunc(\mNrm^{\nxt})^{-\CRRA}]$, where next-period normalized resources $\mNrm^{\nxt}=\RNrmByGRnd(\mNrm-\cFunc(\mNrm))+\tranShkAll$ are generated by following the rule. The $\Rnd{\PermGroFac}_{t+1}^{-\CRRA}$ weight is the footprint of the permanent-income normalization — it is what converts marginal utility of the consumption *ratio* back into level-equivalent terms — making this the stationary, converged-function analogue of the scaled Euler equation ([](#eq-scaledeuler)) that each finite-horizon optimal rule satisfies. The verification is not redundant: the paper's existence machinery works at the level of *value* functions (a weighted-norm contraction), so first-order optimality of the limit object is a conclusion that has to be extracted, not an assumption.

  The proof is a limit-interchange argument. By the existence theorem [nondegenerate-solution-existence](#nondegenerate-solution-existence) (Theorem [](#thm-convgtobellman), which assumes WRIC and FVAC), the finite-horizon rules converge pointwise, $\cFunc_{T-n}\rightarrow\cFunc$ on $\Reals_{++}$. Each $\cFunc_{T-n}$ is the optimal consumption function for its horizon and therefore satisfies the finite-horizon Euler equation with equality. Fixing $\mNrm>0$, the induced next-period resources $\RNrmByGRnd(\mNrm-\cFunc_{T-n}(\mNrm))+\tranShkAll$ converge almost surely to their limit-rule counterpart; the Dominated Convergence argument recorded in the proof of the self-map claim [hiraguchi-continuity](#hiraguchi-continuity) (which leans on the compact supports of the permanent and transitory shocks) then passes the limit through the conditional expectation on the right-hand side. On the left-hand side, $\cFunc_{T-n}(\mNrm)\rightarrow\cFunc(\mNrm)$ with $\cFunc(\mNrm)>0$ on $\Reals_{++}$, so marginal utility converges as well, and the equality survives the limit.

  The property is the workhorse behind the identification of the limiting MPCs. The proof of the MPC-bounds lemma [mpc-bounds-convergence](#mpc-bounds-convergence) (Lemma [](#lemma-MPCBoundsConvg)) opens its second step with exactly this claim: rewriting the equation in consumption-ratio form (Equation [](#eq-eFuncEulerStat), with $\cFunc(\mNrm)/\mNrm$ as the object of interest) and letting $\mNrm\rightarrow\infty$ pins the high-wealth consumption share at $\MPCmin=1-\APFac/\Rfree$, while the $\mNrm\downarrow0$ branch delivers $\MPCmax=1-\pZero^{1/\CRRA}\APFac/\Rfree$. Through those endpoints, the stationary Euler equation feeds the asymptotic consumption-growth analysis and, further downstream, the buffer-stock target and pseudo-target results. It also marks the methodological boundary with the Euler-operator literature the paper cites (the time-iteration approach of Ma, Stachurski, and Toda): there the Euler equation defines the operator being iterated, whereas here it emerges as a verified *property* of a fixed point obtained by contraction on value functions.
relations:
  - kind: requires
    target: weak-return-impatience-condition
    note: 'WRIC (Assumption WRIC) is the stated hypothesis; it is what the existence theorem needs for the pointwise limit $\cFunc_{T-n}\to\cFunc$ that the proof passes the Euler equality through.'
  - kind: implied-by
    target: nondegenerate-solution-existence
    note: 'The proof opens by invoking thm-convgtobellman for pointwise convergence of the finite-horizon optimal rules; combined with per-horizon first-order optimality and dominated convergence, the limit rule inherits the Euler equality.'
  - kind: requires
    target: hiraguchi-continuity
    note: 'The limit is passed through the conditional expectation by the Dominated Convergence argument recorded in the proof of clm-hiraguchi_cont (compact shock supports supply the dominating bounds).'
  - kind: assumed-by
    target: mpc-bounds-convergence
    note: 'The proof of lemma-MPCBoundsConvg identifies the limiting consumption shares by feeding this Euler equation, in ratio form (eq-eFuncEulerStat), through the limits $\mNrm\to\infty$ and $\mNrm\downarrow0$ to obtain $\MPCmin$ and $\MPCmax$.'
  - kind: requires
    target: eq-scaledeuler
    note: 'The finite-horizon normalized (scaled) Euler equation satisfied by each optimal $\cFunc_{T-n}$ is the equality whose horizon limit this property takes.'
