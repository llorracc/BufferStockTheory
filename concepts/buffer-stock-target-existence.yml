  - kind: requires
    target: strong-growth-impatience-condition
    note: 'thm-target assumes GIC-Mod; the proof uses $\GPFacMod<1$ at the limit $\mNrm_t\to\infty$ and in the strict-monotonicity step.'
  - kind: implies
