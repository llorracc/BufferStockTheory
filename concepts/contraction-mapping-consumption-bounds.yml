id: contraction-mapping-consumption-bounds
name: Contraction Mapping Under Consumption Bounds
defining_equation:
  anchor: thm-cmap
  latex: \text{WRIC} \wedge \text{FVAC} \implies \exists\, k,\ \alpha\in(0,1)\ \text{s.t.}\ \forall\,[\MPCminInf,\MPCmaxInf]\ \text{with}\ \MPCmax_{T-k}\geq \MPCmaxInf> \MPCminInf>0,\ \TMap^{\MPCminInf, \MPCmaxInf}\ \text{is a contraction with modulus}\ \alpha
  english: 'Under weak return impatience and finite value of autarky, there exist a threshold horizon $k$ and modulus $\alpha\in(0,1)$ such that the MPC-bounded Bellman operator $\TMap^{\MPCminInf,\MPCmaxInf}$ is a contraction whenever the consumption-share interval $[\MPCminInf,\MPCmaxInf]$ is narrow enough (upper share bounded by the finite-horizon maximal MPC $\MPCmax_{T-k}$).'
gloss: |
  This theorem supplies the analytical engine behind existence of the stochastic problem's limiting solution. Because permanent-income-normalized market resources live on the unbounded domain $\Reals_{++}$, the stationary Bellman operator $\TMap$ need not map any natural Banach space into itself, so the usual fixed-point machinery cannot be applied to it directly. The fix is to bound the consumption *share*: for share bounds $0<\MPCminInf<\MPCmaxInf$ the paper defines an "MPC bounded Bellman operator" $\TMap^{\MPCminInf, \MPCmaxInf}$ that optimizes only over $\cNrm\in[\MPCminInf \mNrm, \MPCmaxInf \mNrm]$, and the theorem shows this restricted operator is a genuine contraction on the weighted-norm space $\mathcal{C}_{\boundFunc}(\Reals_{++},\Reals)$ once the interval is narrow enough (specifically $\MPCmaxInf$ no larger than the finite-horizon maximal MPC $\MPCmax_{T-k}$ for some $k$).

  The result *assumes* [weak return impatience](#WRIC) (WRIC) and [finite value of autarky](#FVAC) (FVAC). WRIC is what keeps the maximal MPCs $\MPCmax_{T-n}$ small enough that the operator stays well-defined and stops the upper consumption bound from approaching zero as the terminal period recedes; it is exactly the inequality used in Claim [maximal-mpc-at-most-one](#maximal-mpc-at-most-one) to produce the threshold horizon $k$. FVAC is what makes the contraction modulus strict: the modulus is $\Shrinker=\max\{\pZero \DiscFac (\Rfree (1-\MPCmax_{k}))^{1-\CRRA},\ \beta\Ex\PermGroFacRnd^{1-\CRRA}\}$ (Remark [](#rem-shnkrdef)), and FVAC is precisely what forces the second term $\beta\Ex\PermGroFacRnd^{1-\CRRA}<1$, so that $\Shrinker<1$. The proof proceeds by verifying the three hypotheses of Boyd's weighted contraction mapping theorem (`thm-Boyd`): monotonicity of $\TMap^{\MPCminInf,\MPCmaxInf}$, that $\TMap^{\MPCminInf,\MPCmaxInf}\mathbf{0}$ is $\boundFunc$-bounded, and a discounting condition that reduces to $\DiscFac\Ex\PermGroFacRnd^{1-\CRRA}\boundFunc\circ\hat{\mFunc}^{\nxt}\leq \Shrinker\boundFunc$.

  Its conclusion feeds directly into the existence argument: the per-period operators $\TMap^{\MPCmin_{T-n}, \MPCmax_{T-n}}$ are eventually contractions with a common modulus, which makes the sequence of finite-horizon value functions Cauchy and hence convergent to a limiting non-degenerate solution (`thm-convgtobellman`, whose proof invokes this theorem for Item (i)(a)). It contrasts with the stronger situation under full [return impatience](#RIC): a remark notes that with RIC the minimal MPC obeys $\MPCmin>0$ for all $n$, so $\TMap^{\MPCmin, \MPCmax_{T-k}}$ becomes a single *stationary* contraction; without RIC, $\MPCmin=0$ and $\TMap^{0,\MPCmax_{T-k}}$ is not even a well-defined operator on $\mathcal{C}_{\boundFunc}(\Reals_{++},\Reals)$, which is exactly why the weaker WRIC plus a time-varying lower share bound is used here.
relations:
  - kind: requires
    target: weak-return-impatience-condition
    note: 'thm-cmap assumes WRIC; via Claim maximal-mpc-at-most-one it keeps the maximal MPCs shrinking so the bounded operator stays well-defined and the upper consumption bound stays strictly positive.'
  - kind: requires
    target: finite-value-of-autarky
    note: 'thm-cmap assumes FVAC; it forces the second term $\beta\Ex\PermGroFacRnd^{1-\CRRA}<1$ of the max defining the modulus $\Shrinker$, giving the strict contraction modulus $\alpha<1$.'
  - kind: requires
    target: boyd-weighted-contraction
    note: 'The proof verifies the three conditions of Boyd''s weighted contraction mapping theorem (thm-Boyd, cite-jboydWeighted).'
  - kind: requires
    target: maximal-mpc-at-most-one
    note: 'The proof opens by fixing $k$ so that Claim maximal-mpc-at-most-one (eq-MPCMAXKleq1) holds; this is what makes $\TMap^{\MPCminInf,\MPCmaxInf}$ well-defined and forces the first term of the modulus $\Shrinker$ strictly below one.'
  - kind: implied-by
    target: feasible-correspondence-not-compact
    note: 'Reciprocal edge: because Berge fails for the non-compact correspondence $\mNrm\mapsto(0,\mNrm)$ (remark-notCompact), the paper cannot fix a point of $\TMap$ directly and instead bounds the consumption share, which is the construction this theorem analyses.'
  - kind: assumed-by
    target: nondegenerate-solution-existence
    note: 'The existence theorem''s proof (thm-convgtobellman) invokes thm-cmap (Item (i)(a)); the eventual-contraction conclusion makes the finite-horizon value-function sequence Cauchy, yielding the limiting non-degenerate solution.'
  - kind: contrasts-with
    target: return-impatience-condition
    note: 'Under RIC, $\MPCmin>0$ gives a single stationary contraction $\TMap^{\MPCmin,\MPCmax_{T-k}}$; under only WRIC, $\MPCmin=0$ forces the time-varying bounded operators used here.'
  - kind: contrasts-with
    target: ric-gives-stationary-contraction
    note: 'Mirror edge: thm-cmap proves the WRIC operators are eventually contractions with a common modulus (Cauchy argument); remark-ricstationary notes RIC upgrades that to a genuinely stationary contraction $\TMap^{\MPCmin,\MPCmax_{T-k}}$ on the whole tail.'
