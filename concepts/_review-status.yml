# concepts/_review-status.yml
#
# DATA FILE. Underscore-prefixed on purpose: tools/concepts_validate.py and
# tools/concepts_render.py skip _-prefixed files, so this tracker is NOT treated
# as a concept (a non-underscore name would BREAK validation). Maintained by hand.

_meta:
  purpose: >-
    Per-concept review tracking for the AI concept atlas (concepts/*.yml).
    One entry per authored concept id; records whether a domain expert has
    reviewed the gloss, the relations, and any external-literature citations.
  statuses:
    pending: not yet reviewed by a domain expert
    reviewed: checked and approved by a domain expert
  WARNING: >-
    NO domain-expert review has occurred for ANY concept yet. Every review field
    below is 'pending'. Do not interpret any entry as expert-approved.
  summary:
    total: 42
    exemplar: 13
    new: 29
    cite_external: 14
  maintained: by hand

